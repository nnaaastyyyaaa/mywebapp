services:
  web:
    image: ghcr.io/nnaaastyyyaaa/mywebapp:stable
    container_name: mywebapp_web
    environment:
      DOCKER: "true"
      PORT: 5200
      DATABASE_URL: postgresql://user:password@db:5432/mywebapp
    ports:
      - "5200:5200"
    depends_on:
      - db
    networks:
      - mywebapp_net

  nginx:
    image: nginx:latest
    container_name: mywebapp_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - mywebapp_net

  db:
    image: postgres:16
    container_name: mywebapp_db
    restart: always
    environment:
      POSTGRES_DB: mywebapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mywebapp_net

networks:
  mywebapp_net:
    driver: bridge

volumes:
  db_data:
