name: Deploy to Target Node

on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/image-build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        run: |
          ssh -tt ubuntu@192.168.56.4 "
            cd /opt/mywebapp &&
            docker compose pull &&
            docker compose up -d &&
            sudo systemctl restart mywebapp
          "

      - name: Verify deployment
        run: |
          ssh ubuntu@192.168.56.4 "
            for i in {1..30}; do
            curl -f http://localhost/health/alive && exit 0
            sleep 5
            done
            docker compose ps
            docker compose logs
            exit 1
          "
