name: Deploy to Target Node

on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/image-build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        run: |
          ssh ubuntu@192.168.56.4 "
            cd /opt/mywebapp &&
            docker compose pull &&
            sudo systemctl restart mywebapp.service 
          "

      - name: Verify deployment
        run: |
          ssh ubuntu@192.168.56.4 "
            set -e
            cd /opt/mywebapp

            curl -f http://localhost/health/alive
            curl -f http://localhost/health/ready

            docker compose ps
          "
