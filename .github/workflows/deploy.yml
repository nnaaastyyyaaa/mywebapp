name: Deploy to Target Node

on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/image-build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        run: |
          ssh ubuntu@192.168.56.4 "
            cd /opt/mywebapp &&
            docker compose pull &&
            sudo systemctl restart mywebapp.service 
          "

      - name: Verify deployment
        run: |
          ssh ubuntu@192.168.56.4 "
            set -e
            cd /opt/mywebapp

            for i in {1..30}; do
                if curl -fs http://localhost/health/alive && curl -fs http://localhost/health/ready; then
                  echo "App is ready"
                  exit 0
                fi

                echo "Waiting for app... attempt $i/30"
                sleep 5
              done

              echo "App failed health check"
              docker compose ps
              docker compose logs web --tail=100
              docker compose logs nginx --tail=100
              exit 1

            docker compose ps
          "
